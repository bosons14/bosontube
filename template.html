<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BosonTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0f10; --panel:#161618; --panel2:#1e1e21; --line:#2a2a2e;
    --text:#ececee; --muted:#9a9aa3; --accent:#ff4d5a; --ok:#46a758;
    --radius:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:14px}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit}
  /* top bar */
  .top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;padding:10px 20px;background:rgba(15,15,16,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .burger{display:none;background:none;border:0;font-size:20px;cursor:pointer;padding:4px 8px}
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;letter-spacing:-.3px;white-space:nowrap}
  .logo .mark{width:28px;height:20px;border-radius:6px;background:var(--accent);display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:#fff}
  .logo small{font-weight:500;color:var(--muted);font-size:12px}
  .search{flex:1;min-width:0;max-width:560px;margin:0 auto;display:flex}
  .search input{min-width:0}
  .search input{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px;color:var(--text);font:inherit;outline:none}
  .search input:focus{border-color:#555}
  /* layout */
  .wrap{display:flex}
  nav.side{width:220px;flex-shrink:0;padding:12px 10px;position:sticky;top:53px;height:calc(100vh - 53px);overflow:auto;border-right:1px solid var(--line)}
  .side a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:10px;color:var(--text)}
  .side a:hover{background:var(--panel2)}
  .side a.on{background:var(--panel2);font-weight:600}
  .side .ico{width:18px;text-align:center;opacity:.9}
  .side h4{margin:16px 12px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
  .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
  .side .foot{margin:18px 12px;color:var(--muted);font-size:12px;line-height:1.5}
  main{flex:1;min-width:0;padding:18px 24px 60px}
  /* chips */
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;scrollbar-width:none}
  .chip{white-space:nowrap;padding:7px 13px;border-radius:9px;background:var(--panel2);border:1px solid transparent;cursor:pointer;font-weight:500}
  .chip.on{background:var(--text);color:#111}
  h1{font-size:22px;margin:4px 0 4px;letter-spacing:-.4px}
  .sub{color:var(--muted);margin:0 0 18px;line-height:1.5;max-width:760px}
  /* grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px 16px}
  .card{display:block;cursor:pointer}
  .thumb{position:relative;aspect-ratio:16/9;border-radius:var(--radius);overflow:hidden;display:grid;place-items:center;transition:transform .15s}
  .card:hover .thumb{transform:translateY(-2px)}
  .thumb .code{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:30px;color:rgba(255,255,255,.95);text-shadow:0 2px 12px rgba(0,0,0,.35);letter-spacing:-1px;padding:0 12px;text-align:center}
  .thumb .org{position:absolute;left:12px;top:10px;font-size:11px;font-weight:600;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.06em}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .badge{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.78);color:#fff;font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px}
  .pick{position:absolute;left:8px;bottom:8px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:5px}
  .meta{display:flex;gap:10px;margin-top:10px}
  .av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
  .meta h3{margin:0 0 4px;font-size:15px;line-height:1.3;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
  .empty{color:var(--muted);padding:40px 0}
  /* detail overlay */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
  .ov.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:620px;width:100%;overflow:hidden;max-height:92vh;overflow-y:auto}
  .modal .thumb{border-radius:0;aspect-ratio:auto;height:220px}
  .modal .body{padding:18px 22px 22px}
  .modal h2{margin:0 0 6px;font-size:20px;letter-spacing:-.3px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}
  .tag{font-size:12px;padding:4px 9px;border-radius:999px;background:var(--panel2);color:var(--muted)}
  .modal .blurb{line-height:1.6;margin:0 0 16px}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--accent);color:#fff;font-weight:600;border:0;cursor:pointer}
  .btn.ghost{background:var(--panel2);color:var(--text)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .inpaths{margin-top:16px;color:var(--muted);font-size:13px}
  .inpaths a{color:var(--text);text-decoration:underline;text-underline-offset:3px}
  .x{float:right;background:none;border:0;font-size:22px;cursor:pointer;color:var(--muted);line-height:1}
  /* paths */
  .paths{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .pcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:block;cursor:pointer;transition:border-color .15s}
  .pcard:hover{border-color:#444}
  .pcard h3{margin:0 0 6px;font-size:16px}
  .pcard p{margin:0 0 12px;color:var(--muted);line-height:1.5}
  .strip{display:flex;gap:4px;margin-bottom:12px}
  .strip span{flex:1;height:32px;border-radius:6px;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;color:rgba(255,255,255,.9);overflow:hidden;white-space:nowrap}
  .bar{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .3s}
  .small{font-size:12px;color:var(--muted);margin-top:6px}
  .steps{list-style:none;margin:0;padding:0;max-width:880px}
  .step{display:flex;gap:16px;align-items:stretch;position:relative;padding-bottom:18px}
  .step:not(:last-child)::before{content:"";position:absolute;left:17px;top:38px;bottom:0;width:2px;background:var(--line)}
  .num{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:700;background:var(--panel2);border:2px solid var(--line);cursor:pointer;z-index:1}
  .step.done .num{background:var(--ok);border-color:var(--ok);color:#fff}
  .sbox{flex:1;display:flex;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
  .sbox .thumb{width:200px;flex-shrink:0;border-radius:9px}
  .sbox .thumb .code{font-size:20px}
  .sbox h3{margin:2px 0 4px;font-size:15px}
  .sbox p{margin:0 0 8px;color:var(--muted);line-height:1.5;font-size:13px}
  .sbox .row{gap:8px}
  .sbox .btn{padding:6px 12px;font-size:13px}
  .back{color:var(--muted);display:inline-block;margin-bottom:10px}
  .back:hover{color:var(--text)}
  @media (max-width:820px){
    nav.side{position:fixed;left:0;top:53px;background:var(--bg);z-index:15;transform:translateX(-100%);transition:transform .2s}
    nav.side.open{transform:none}
    .burger{display:block}
    .logo small{display:none}
    main{padding:14px}
    .sbox{flex-direction:column}
    .sbox .thumb{width:100%}
  }
</style>
</head>
<body>
<header class="top">
  <button class="burger" id="burger" aria-label="Menu">☰</button>
  <a class="logo" href="#"><span class="mark">▶</span>BosonTube <small>AI · ML · Gen AI courses</small></a>
  <form class="search" id="sform"><input id="q" type="search" placeholder="Search courses, talks, teachers…" autocomplete="off"></form>
</header>
<div class="wrap">
  <nav class="side" id="side"></nav>
  <main id="main"></main>
</div>
<div class="ov" id="ov"><div class="modal" id="modal"></div></div>

<script>
const DATA = /*__DATA__*/null;
const T = DATA.topics, ITEMS = DATA.items, PATHS = DATA.paths;
const byId = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// progress (this browser only)
let done = {};
try { done = JSON.parse(localStorage.getItem('bosontube-done') || '{}'); } catch(e) {}
function save(){ try { localStorage.setItem('bosontube-done', JSON.stringify(done)); } catch(e) {} }

function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  const f = c => Math.max(0, Math.min(255, c + amt));
  return '#' + [f(n>>16), f((n>>8)&255), f(n&255)].map(v => v.toString(16).padStart(2,'0')).join('');
}
function grad(topic){ const c = T[topic].color; return `linear-gradient(135deg, ${c} 0%, ${shade(c,-70)} 100%)`; }
function initials(s){ return s.split(/[\s&×\/.-]+/).filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase(); }

function thumb(it, extra=''){
  const img = it.vid ? `<img alt="" loading="lazy" src="https://i.ytimg.com/vi/${it.vid}/hqdefault.jpg" onerror="this.remove()">` : '';
  return `<div class="thumb ${extra}" style="background:${grad(it.topic)}">
    <span class="org">${esc(it.org)}</span><span class="code">${esc(it.code)}</span>${img}
    ${it.pick ? '<span class="pick">★ Must-watch</span>' : ''}
    <span class="badge">${it.kind === 'course' ? '▤ Course' : '▶ Talk'}</span></div>`;
}
function card(it){
  return `<a class="card" data-open="${it.id}">${thumb(it)}
    <div class="meta"><div class="av" style="background:${shade(T[it.topic].color,-40)}">${esc(initials(it.org))}</div>
    <div><h3>${esc(it.title)}</h3><p>${esc(it.by)}<br>${esc(T[it.topic].label)} · ${it.level} · ${it.year}</p></div></div></a>`;
}

function sidebar(view){
  const link = (h, ico, label) => `<a href="#${h}" class="${view===h?'on':''}"><span class="ico">${ico}</span>${label}</a>`;
  $('#side').innerHTML =
    link('', '⌂', 'Home') + link('paths', '◈', 'Learning paths') + link('courses', '▤', 'Courses') +
    link('talks', '▶', 'Talks') + link('picks', '★', 'Must-watch') +
    '<h4>Topics</h4>' +
    Object.entries(T).map(([k,t]) => `<a href="#topic-${k}" class="${view==='topic-'+k?'on':''}"><span class="dot" style="background:${t.color}"></span>${t.label}</a>`).join('') +
    `<div class="foot">${ITEMS.length} hand-picked courses and talks. Videos play on YouTube. Inspired by Karpathy's HackerTube.</div>`;
}

function grid(list){ return list.length ? `<div class="grid">${list.map(card).join('')}</div>` : '<p class="empty">Nothing matches that yet.</p>'; }
function chips(active){
  return `<div class="chips"><a class="chip ${!active?'on':''}" href="#">All</a>` +
    Object.entries(T).map(([k,t]) => `<a class="chip ${active===k?'on':''}" href="#topic-${k}">${t.label}</a>`).join('') + '</div>';
}
const LV = {Beginner:0, Intermediate:1, Advanced:2};
const sorted = l => [...l].sort((a,b) => (b.pick?1:0)-(a.pick?1:0) || LV[a.level]-LV[b.level] || b.year-a.year);

function pathProgress(p){ const n = p.steps.filter(s => done[s]).length; return [n, p.steps.length]; }
function pathCard(p){
  const [n,t] = pathProgress(p);
  return `<a class="pcard" href="#path-${p.id}"><div class="strip">${p.steps.map(s => `<span style="background:${grad(byId[s].topic)}">${esc(byId[s].code)}</span>`).join('')}</div>
    <h3>${esc(p.title)}</h3><p>${esc(p.desc)}</p>
    <div class="bar"><i style="width:${100*n/t}%"></i></div><div class="small">${p.level} · ${t} steps · ${n} done</div></a>`;
}

function render(){
  const h = decodeURIComponent(location.hash.slice(1));
  const q = $('#q').value.trim().toLowerCase();
  sidebar(h);
  let html = '';
  if (q) {
    const hits = ITEMS.filter(i => [i.title,i.by,i.org,i.code,i.blurb,T[i.topic].label].join(' ').toLowerCase().includes(q));
    html = `<h1>Results for “${esc(q)}”</h1><p class="sub">${hits.length} found</p>` + grid(sorted(hits));
  } else if (h === 'paths') {
    html = `<h1>Learning paths</h1><p class="sub">Ordered tracks through the library. Tick off each step as you finish it; progress stays in this browser.</p><div class="paths">${PATHS.map(pathCard).join('')}</div>`;
  } else if (h.startsWith('path-')) {
    const p = PATHS.find(x => 'path-'+x.id === h);
    if (!p) { location.hash = 'paths'; return; }
    const [n,t] = pathProgress(p);
    html = `<a class="back" href="#paths">← All learning paths</a><h1>${esc(p.title)}</h1><p class="sub">${esc(p.desc)}</p>
      <div style="max-width:880px;margin-bottom:22px"><div class="bar"><i style="width:${100*n/t}%"></i></div><div class="small">${n} of ${t} done · ${p.level}</div></div>
      <ol class="steps">${p.steps.map((s,i) => { const it = byId[s]; return `<li class="step ${done[s]?'done':''}">
        <button class="num" data-toggle="${s}" title="Mark as done">${done[s]?'✓':i+1}</button>
        <div class="sbox">${thumb(it)}<div style="min-width:0"><h3>${esc(it.title)}</h3><p>${esc(it.by)} · ${it.level} · ${it.year}</p><p>${esc(it.blurb)}</p>
        <div class="row"><a class="btn" href="${it.url}" target="_blank" rel="noopener">▶ Watch on YouTube</a>
        <button class="btn ghost" data-toggle="${s}">${done[s]?'Undo':'Mark done'}</button></div></div></div></li>`; }).join('')}</ol>`;
  } else if (h === 'courses') {
    html = `<h1>Courses</h1><p class="sub">Full lecture series and university courses.</p>` + grid(sorted(ITEMS.filter(i => i.kind==='course')));
  } else if (h === 'talks') {
    html = `<h1>Talks</h1><p class="sub">Standout single lectures and build-alongs.</p>` + grid(sorted(ITEMS.filter(i => i.kind==='talk')));
  } else if (h === 'picks') {
    html = `<h1>Must-watch</h1><p class="sub">The classics people keep pointing each other to.</p>` + grid(sorted(ITEMS.filter(i => i.pick)));
  } else if (h.startsWith('topic-') && T[h.slice(6)]) {
    const k = h.slice(6);
    html = chips(k) + `<h1>${T[k].label}</h1><p class="sub">${ITEMS.filter(i => i.topic===k).length} courses and talks</p>` + grid(sorted(ITEMS.filter(i => i.topic===k)));
  } else {
    html = chips(null) +
      `<h1>Start a path</h1><p class="sub">Not sure where to begin? Pick a track and follow it in order.</p><div class="paths" style="margin-bottom:34px">${PATHS.slice(0,3).map(pathCard).join('')}</div>` +
      `<h1>Everything</h1><p class="sub">Every course and talk, must-watch first.</p>` + grid(sorted(ITEMS));
  }
  $('#main').innerHTML = html;
  $('#side').classList.remove('open');
}

function openItem(id){
  const it = byId[id]; if (!it) return;
  const inP = PATHS.filter(p => p.steps.includes(id));
  $('#modal').innerHTML = thumb(it) + `<div class="body"><button class="x" data-close>×</button><h2>${esc(it.title)}</h2>
    <div style="color:var(--muted)">${esc(it.by)}${it.org!==it.by?' · '+esc(it.org):''}</div>
    <div class="tags"><span class="tag">${T[it.topic].label}</span><span class="tag">${it.level}</span><span class="tag">${it.kind==='course'?'Course / playlist':'Talk'}</span><span class="tag">${it.year}</span></div>
    <p class="blurb">${esc(it.blurb)}</p>
    <div class="row"><a class="btn" href="${it.url}" target="_blank" rel="noopener">▶ Watch on YouTube</a>
    <button class="btn ghost" data-toggle="${id}">${done[id]?'✓ Done':'Mark done'}</button></div>
    ${inP.length ? `<div class="inpaths">Part of: ${inP.map(p => `<a href="#path-${p.id}" data-close>${esc(p.title)}</a>`).join(', ')}</div>` : ''}</div>`;
  $('#ov').classList.add('show');
}
function closeItem(){ $('#ov').classList.remove('show'); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-open],[data-toggle],[data-close]');
  if (!t) { if (e.target.id === 'ov') closeItem(); return; }
  if (t.dataset.open) { e.preventDefault(); openItem(t.dataset.open); }
  else if (t.dataset.toggle) {
    const id = t.dataset.toggle; done[id] = !done[id]; if (!done[id]) delete done[id]; save();
    render(); if ($('#ov').classList.contains('show')) openItem(id);
  }
  else if (t.dataset.close !== undefined) closeItem();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeItem(); if (e.key === '/' && document.activeElement !== $('#q')) { e.preventDefault(); $('#q').focus(); } });
$('#q').addEventListener('input', render);
$('#sform').addEventListener('submit', e => e.preventDefault());
$('#burger').addEventListener('click', () => $('#side').classList.toggle('open'));
window.addEventListener('hashchange', () => { $('#q').value = ''; render(); window.scrollTo(0,0); });
render();
</script>
</body>
</html>
